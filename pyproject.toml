[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optmempy"
version = "0.1.0"
description = "Optimization framework for nanofiltration cascade systems"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  {name = "Kenia Moreno Martinez", email = "kenia.morenomartinez@kaust.edu.sa"}
]

license = {file = "LICENSE"}

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "pyomo",
  "maingopy",
  "joblib"
]